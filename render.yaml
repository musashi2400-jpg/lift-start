services:
  - type: web
    name: lift-start
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
        required: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
        required: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
        required: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://lift-start.onrender.com
